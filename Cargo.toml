[package]
name = "toki-sync"
version = "2.2.0"
edition = "2021"
description = "toki multi-device token usage sync server"
license = "MIT"
repository = "https://github.com/korjwl1/toki-sync"
homepage = "https://github.com/korjwl1/toki-sync"

[[bin]]
name = "toki-sync"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "postgres", "runtime-tokio", "macros", "migrate"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toki-sync-protocol = { git = "https://github.com/korjwl1/toki-sync-protocol.git", tag = "v1.1.0" }
toml = "1"

# Auth
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.23"
bcrypt = "0.19"

# Compression
zstd = "0.13"

# HTTP client (VM remote_write)
ureq = { version = "2", features = ["json"] }
urlencoding = "2"

# HTTP client (OIDC token exchange)
reqwest = { version = "0.12", features = ["json"] }

# HTTP response (bytes)
bytes = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Embedded event store
fjall = "3"

# Config / utils
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
# `util` brings ServiceExt::oneshot, which drives the real router in-process so
# the endpoint tests exercise routing, extractors and auth rather than calling
# handler functions directly.
tower = { version = "0.5", features = ["util"] }
