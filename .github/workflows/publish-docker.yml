name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: korjwl11/toki-sync:${{ inputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=toki-sync-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=toki-sync-${{ matrix.suffix }}

  manifest:
    name: Publish multi-architecture tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Create and verify manifest
        run: |
          docker buildx imagetools create \
            --tag korjwl11/toki-sync:${{ inputs.version }} \
            --tag korjwl11/toki-sync:latest \
            korjwl11/toki-sync:${{ inputs.version }}-amd64 \
            korjwl11/toki-sync:${{ inputs.version }}-arm64
          docker buildx imagetools inspect korjwl11/toki-sync:${{ inputs.version }}
